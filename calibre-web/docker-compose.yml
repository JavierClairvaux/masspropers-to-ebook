services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - NETWORK_SHARE_MODE=false
      - CWA_PORT_OVERRIDE=8083
    volumes:
      - ./config:/config
      - ./ingest:/cwa-book-ingest # drop new EPUBs here; auto-imported then deleted
      - ./library:/calibre-library # the actual Calibre library (metadata.db lives here)
    ports:
      - 8083:8083
    restart: unless-stopped
