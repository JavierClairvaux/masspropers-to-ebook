services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOCKER_MODS=linuxserver/mods:universal-calibre # adds calibre's ebook-convert, optional
    volumes:
      - ./config:/config
      - ../output:/books # masspropers-generated EPUBs, served read-only into the library
    ports:
      - 8083:8083
    restart: unless-stopped
